<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" overflow="hidden">
  <style>
    .letter { animation: fade-in 0.3s ease-out both; }

    /* Перекладина: уходит ОДНОВРЕМЕННО с движением клыка */
    .h-bar { animation: h-bar-shrink 1.3s cubic-bezier(0.3, 0.7, 0.3, 1) 0.5s both; }
    @keyframes h-bar-shrink {
      0%, 20% { width: 595px; }   /* ждём касания клыка */
      65%     { width: 346px; }   /* клык идёт влево — перекладина уходит вместе */
      82%     { width: 368px; }   /* мягкий отскок */
      100%    { width: 361px; }
    }

    /* Большой клык: медленнее и плавнее, бьёт справа */
    .big-fang { animation: big-fang-strike 1.3s cubic-bezier(0.3, 0.7, 0.3, 1) 0.5s both; }
    @keyframes big-fang-strike {
      0%   { transform: translateX(1200px); }
      65%  { transform: translateX(-18px); }
      82%  { transform: translateX(7px); }
      100% { transform: translateX(0); }
    }

    /* Маленькие клыки */
    .fang-small {
      transform-box: fill-box;
      transform-origin: center;
      animation: fang-out 0.7s cubic-bezier(0.25, 0.8, 0.35, 1.2) both;
    }
    .f-br { --dx: -40px; animation-delay: 1.35s; }
    .f-bl { --dx: 40px;  animation-delay: 1.45s; }
    .f-tr { --dx: -40px; animation-delay: 1.55s; }
    .f-tl { --dx: 40px;  animation-delay: 1.65s; }
    @keyframes fang-out {
      0%   { opacity: 0; transform: translate(var(--dx), 0) scale(0.3); }
      20%  { opacity: 1; }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    /* Эффект живости: лёгкий долгий сплюс после появления клыков */
    .logo {
      transform-origin: 500px 520px;
      animation: life-squash 1.3s ease-in-out 2.2s both;
    }
    @keyframes life-squash {
      0%   { transform: scale(1, 1); }
      25%  { transform: scale(1.04, 0.95); }
      50%  { transform: scale(0.97, 1.03); }
      72%  { transform: scale(1.02, 0.985); }
      100% { transform: scale(1, 1); }
    }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <!-- Фон -->
  <rect width="1000" height="1000" fill="#171717"/>

  <g class="logo">
    <!-- БУКВА Т -->
    <g class="letter">
      <rect class="h-bar" x="221" y="228" width="361" height="127" rx="25" fill="#8B5CF6"/>
      <rect x="582" y="228" width="595" height="127" rx="25" transform="rotate(90 582 228)" fill="#8B5CF6"/>
    </g>

