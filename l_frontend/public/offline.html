<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6366f1" />
  <title>Нет соединения — trelod</title>
  <link rel="icon" href="/pwa/icon-192.png" />
  <style>
    :root {
      --bg: #171717;
      --fg: #e5e7eb;
      --accent: #6366f1;
      --muted: #9ca3af;
      --card: #1f2937;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #232057 0%, var(--bg) 55%);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .icon {
      width: 88px; height: 88px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 800; color: #fff;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.55; font-size: 15px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 20px 0 24px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(99,102,241,0.14);
      color: #a5b4fc;
      font-size: 13px; font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6366f1; animation: pulse 1.6s infinite; }
    button {
      cursor: pointer;
      border: none;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 12px;
      color: #fff;
      background: var(--accent);
      transition: transform .15s ease, opacity .15s ease;
    }
    button:active { transform: scale(0.97); }
    button.ghost {
      margin-top: 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.12);
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f3f4f6; --fg: #111827; --card: #ffffff; --muted: #6b7280; }
      .dot { background: #4f46e5; }
      .icon { box-shadow: 0 12px 30px rgba(79,70,229,.35); }
    }
  </style>
</head>
<body>
  <div class="card" role="alert">
    <div class="icon">N</div>
    <h1>Вы офлайн</h1>
    <p>Похоже, вы потеряли соединение с интернетом.<br/>Мы сохранили приложение для офлайн-работы.</p>
    <div class="status"><span class="dot"></span>Режим офлайн</div>
    <button id="retry" type="button">Попробовать снова</button>
    <br/>
    <button class="ghost" id="reload" type="button">Перезагрузить</button>
  </div>

  <script>
    (function () {
      var retry = document.getElementById("retry");
      var reload = document.getElementById("reload");
      function go() { window.location.reload(); }
      retry.addEventListener("click", go);
      reload.addEventListener("click", go);
      // Автоматически пробуем переподключиться, когда сеть вернулась
      window.addEventListener("online", go);
      // Разрешаем повторный клик после появления сети
      setInterval(function () {
        if (navigator.onLine && document.hidden === false) go();
      }, 8000);
    })();
  </script>
</body>
</html>
