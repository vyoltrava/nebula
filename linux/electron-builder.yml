# electron-builder.yml — Linux сборка (deb, appimage)
#   npm run dist   → release/trelod-<version>.AppImage / trelod-<version>.deb
#   npm run release <version> → копирует AppImage/deb в публичную папку + обновляет update.json

appId: trelod.linux
productName: trelod

 directories:
   output: release
   buildResources: build

# Фронтенд грузится удалённо по NEBULA_APP_URL (как в Windows и Capacitor)
files:
  - main/**/*
  - package.json

asar: true

# Сжатие — как у APK (differential). plain = быстрее сборка.
compression: normal

linux:
  target:
    - deb
    - appimage
  icon: ../l_frontend/public/pwa/icon-512.png

  # Deb-пакет настроек
  deb:
    synopsis: "Trelod — anonymous social desktop application"
    description: "Full-fledged Trelod client for Linux"
    categories: Utility

  # AppImage-настроек
  appimage:
    synopsis: "Trelod — anonymous social desktop application"

# Иконка берётся из l_frontend/public/ — единый источник (git), дублей в linux/ нет.

# Имя артефакта важно для release-скрипта:
artifactName: trelod-${version}.${ext}
