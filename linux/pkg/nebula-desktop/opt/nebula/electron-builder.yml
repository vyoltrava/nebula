# electron-builder.yml — Linux сборка (deb, appimage)
#   npm run dist   → release/nebula-<version>.AppImage / nebula-<version>.deb
#   npm run release <version> → копирует AppImage/deb в публичную папку + обновляет update.json

appId: nebula.linux
productName: nebula

 directories:
   output: release
   buildResources: build

# Фронтенд грузится удалённо по NEBULA_APP_URL (как в Windows и Capacitor)
files:
  - main/**/*
  - package.json

asar: true

# Сжатие — как у APK (differential). plain = быстрее сборка.
compression: normal

linux:
  target:
    - deb
    - appimage
  icon: ../l_frontend/public/pwa/icon-512.png

  # Deb-пакет настроек
  deb:
    synopsis: "Nebula — аноциальный социальный мессенджер"
    description: "Полноценный клиент Nebula для Linux"
    categories: Utility

  # AppImage-настроек
  appimage:
    synopsis: "Nebula — аноциальный социальный мессенджер"

# Иконка берётся из l_frontend/public/ — единый источник (git), дублей в linux/ нет.

# Имя артефакта важно для release-скрипта:
artifactName: nebula-${version}.${ext}
